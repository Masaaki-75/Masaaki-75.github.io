<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
  <title id="title">MERA: foundation-model spaces to MedVTok, then MedVTok to each foundation-model space</title>
  <desc id="desc">In the first direction, separate projectors p1, p2 and pm map features from multiple foundation-model spaces into the shared MedVTok representation space for contrastive alignment. In the second direction, separate backprojectors q1, q2 and qm map MedVTok features into the corresponding native foundation-model spaces for complementary cosine alignment. Colors identify the same foundation model in both directions. Filled dots indicate foundation-model features; open rings indicate MedVTok features.</desc>
